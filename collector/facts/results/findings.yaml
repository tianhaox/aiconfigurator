# OUTPUT: curated conclusions from probe campaigns (the facts archive's
# human layer). Each finding states its own evidence paths, versions and
# dates inline; applies_to lists where it was observed. Rots with
# framework releases — re-verify on version bumps. Inputs live in targets.yaml.
findings:
  sm103_watchlist_campaign:
    statement: 'b300 (sm103, 4x B300 SXM6, compute_cap 10.3) watchlist campaign 2026-08-26: a 20-checkpoint x
      3-backend subset (60 runs; DSV4 all three quant artifact classes, FP8/NVFP4/MXFP4/bf16 MoE representatives,
      dense controls, K3, MiMo) probed with generator-rendered b300_sxm configs — results/sm103/ holds ONLY this
      subset (deliberate; the un-probed roster is not represented, no synthetic fails). Verdicts: sglang 16/20,
      vllm 18/20, trtllm 14/20 boot from plain generate; EVERY failure matches its sm100 counterpart exactly (K3
      arch/quant-parser, M3 sparse-config pydantic, MiMo shape, DSV4 native fp4-packed runner gap) — no sm103-specific
      regression surfaced in this subset. Both sm100-derived generator facts VALIDATED on sm103 via the shared
      b200 hardware profile: trtllm fp8-MoE DEEPGEMM renders run (R1, GLM-5.2-FP8, Qwen3-30B-FP8 green), and the
      DSV4 sglang env fact is NEEDED here too — A/B without SGLANG_OPT_FP8_WO_A_GEMM=0 crashes at load in the GENERIC
      fp8 ue8m0 requant chain (requant_block_scale_ue8m0_for_deepgemm -> per_block_cast_to_fp8, ab/dsv4_sm103_noenv.json)
      — the same chain 0.5.18 crashes in on sm100, unifying the root cause: DSV4''s grouped wo_a weight geometry
      fed to the ue8m0 requant/cast kernels fails across sm100/sm103 and 0.5.16/0.5.18; removing wo_a from the
      fp8 path (the env) sidesteps it on both. Identity delta vs sm100: trtllm attention re-dispatches to sm103a
      kernel builds (fmhaSm100f/Sm100a* -> fmhaSm103a*, 8 checkpoints — trtllm-gen ships per-SM cubins and floors
      correctly); sglang/vllm kernel identities unchanged. K3''s SM103-gated MegaMoE path (topology_sm103) remains
      UNANSWERED — K3 fails at arch registration before any MoE path activates, on all three backends at these
      pins.'
    applies_to:
    - platform:sm103
  sm100_sglang_deepep_moe:
    statement: 'GENERATOR GAP (b200 sweep 2026-08-24): the b200/gb200 hardware profile (generator/facts/hardware.yaml:109
      moe_backend.sglang=deepep_moe) renders --moe-runner-backend deepep_moe for EVERY MoE deployment, but sglang
      0.5.16''s ServerArgs parser rejects it (invalid choice — valid set is auto/deep_gemm/triton/.../cutlass/marlin;
      deepep is an --moe-a2a-backend concern in this version). Plain `cli generate` sglang MoE deployments on b200
      therefore CANNOT BOOT: 70/95 roster checkpoints fail at argparse, dense models pass (25). probe_sglang now
      records parser rejections as structured engine_cli_parse errors instead of dying before dump. FIXED 2026-08-24
      (apply.py wide-EP gating, commit ec8035ac): re-sweep moves sglang to 80 pass + 3 pass+custom / 12 fail —
      runner auto-selection now probed per checkpoint. Wide-EP sglang renders still emit deepep_moe (0.5.16 spells
      it --moe-a2a-backend deepep) — version-matrix follow-up.'
    applies_to:
    - platform:sm100
  sm100_trtllm_wideep_dp:
    statement: 'GENERATOR GAP (b200 sweep 2026-08-24): the b200 hardware profile sets moe_backend.trtllm=WIDEEP;
      the rendered agg config does not enable attention DP, and trtllm 1.3.0rc23 asserts ''Attention DP should be
      used with WideEP'' at boot — 61/95 roster checkpoints (every MoE) fail on tp1. Two sub-variants: ''bias not
      supported in WideEPMoE'' (Qwen1.5-MoE, Mixtral-class with bias) once WideEP binds. The WIDEEP selection is
      documented in generator/facts/apply.py:104 as a Blackwell STARTUP-CRASH avoidance — on tp1/ep1 it produces
      the opposite. vllm (whose MoE backend comes from model defaults, not this hardware fact) passes 89/95 on the
      same renders. FIXED 2026-08-24 (apply.py wide-EP gating, commit ec8035ac): re-sweep moves trtllm to 67 pass
      + 2 pass+custom / 26 fail; the residual cluster is sm100_trtllm_fp8moe_deepgemm.'
    applies_to:
    - platform:sm100
  sm100_trtllm_fp8moe_deepgemm:
    statement: 'b200 re-sweep 2026-08-24 (post wide-EP fix), trtllm 1.3.0rc23: with the framework-default CUTLASS
      MoE backend, EVERY FP8-quantized MoE checkpoint (16/95: DeepSeek R1/V3/V3.2/V4-family FP8, Kimi-K2, GLM-5.x-FP8,
      Qwen3-*-FP8) aborts at first MoE forward with "This is the Cutlass backend with DeepGemm JIT path. For Blackwell
      (SM100+) support, please use the DEEPGEMM backend instead." NVFP4/bf16 MoE run fine on the same default. The
      generator needs a QUANT-CONDITIONAL moe_backend fact for sm100 trtllm (fp8-profile MoE -> DEEPGEMM) — the
      current hardware.moe_backend surface is per-backend scalar and cannot express it. FIXED 2026-08-25 (moe_backend_quant
      fact + ModelConfig.quant_algo plumbing, commit 1d823d38): all 18 affected renders re-probed green; trtllm
      matrix moves to 79 pass + 8 pass+custom / 8 fail, and the residual fails are per-model framework gaps (M3
      sparse-config pydantic, MiMo arch unregistered, Kimi quant parser).'
    applies_to:
    - platform:sm100
  sm100_sglang_dsv4_root_cause:
    statement: 'ROOT CAUSE + partial workaround for sm100_sglang_dsv4_device_assert (b200 A/B 2026-08-25): the
      blanket load-time crash is sglang 0.5.16''s fp8 wo_a GEMM optimization — post_load_weights -> _setup_fp8_wo_a_scales
      (deepseek_v4.py:2577) calls deep_gemm transform_sf_into_required_layout under DEEPGEMM_SCALE_UE8M0 (sm100-only
      branch) and the kernel dies with CUDA_ERROR_LAUNCH_FAILED (smxx_layout.hpp:72). Runner choice is irrelevant
      (all six runners crash identically at load). SGLANG_ENABLE_JIT_DEEPGEMM=0 is NOT an escape (sglang NameError:
      deep_gemm referenced while disabled — a second 0.5.16 bug). Verified workaround: env SGLANG_OPT_FP8_WO_A_GEMM=0
      -> NVFP4 and converted-FP8 artifacts (4/8) run fully green under runner auto; NATIVE fp8 artifacts (fp4-packed
      experts, 4/8) then hit a second wall with NO working runner: triton=hidden-size mismatch, marlin="MXFP4 Marlin
      requires SM90 or SM120", flashinfer_cutlass=Fp8MoEMethod missing .runner, flashinfer_trtllm_routed=dtype
      check (expects e4m3, gets packed fp4). Evidence facts ab/dsv4*_nowoa_*.json. The workaround is an ENV VAR,
      which no current generator fact surface renders (model defaults emit backend_args only) — env support in
      model defaults is the follow-up increment; until then DSV4-on-sglang-sm100 stays fail in the matrix with
      this citation. RE-VERIFIED on sglang 0.5.18 (latest, 2026-08-25, live on B200): still broken — the crash
      moved from the wo_a-specific transform into the GENERIC fp8 block-quant path (process_weights_after_loading_block_quant
      -> requant_block_scale_ue8m0_for_deepgemm -> per_block_cast_to_fp8, same CUDA_ERROR_LAUNCH_FAILED), and it
      is DSV4-SHAPE-SPECIFIC (GLM/Qwen FP8 checkpoints pass through the same requant on sm100). The env workaround
      still works on 0.5.18 (NVFP4 + converted-FP8 green; evidence ab/dsv4*_0518_*.json). Workaround COST: load-time
      _dequant_fp8_wo_a stores wo_a in bf16 — wo_a is ReplicatedLinear (not TP-sharded), DSV4-Pro o_groups=16 x
      o_lora_rank=1024 x D~4096 x 61 layers ~= 4.1B params -> ~+4 GB per GPU vs fp8 — and the wo_a einsum runs
      as plain bf16 torch.einsum instead of DeepGEMM fp8 (that one GEMM ~2x slower; numerically equal-or-better).
      Upstream-report material for sglang. GENERATOR FIX 2026-08-25 (commit 50d316be): model-default facts gained
      an env surface; the DSV4 profile now renders SGLANG_OPT_FP8_WO_A_GEMM=0 on b200/gb200 (run.sh # facts-env
      exports + k8s worker env), and the nvidia/DeepSeek-V4* artifacts joined the profile match. Re-probe: NVFP4
      (runner FLASHINFER_TRTLLM_ROUTED) and converted-FP8 (runner auto) artifacts now boot from plain generate
      — sglang matrix 84 pass + 3 pass+custom / 8 fail. The 4 native fp4-packed artifacts remain unservable on
      sglang/sm100 (no runner accepts the packed layout) — framework gap, not renderable around.'
    applies_to:
    - family:dsv4
  sm100_sglang_nvfp4_flashinfer_cutlass:
    statement: 'b200 re-sweep 2026-08-24, sglang 0.5.16: NVFP4 MoE under runner auto resolves FLASHINFER_TRTLLM
      on three checkpoints (MiniMax-M2.5/M2.7-NVFP4, Qwen3.6-35B-A3B-NVFP4), which modelopt_quant.py:2621 rejects
      ("Use --moe-runner-backend flashinfer_cutlass instead") — an auto-selection gap in sglang, since its own
      error names the working choice. Pinned via targets.yaml cli_extra_args (now pass+custom, runner=FLASHINFER_CUTLASS
      verified). Other NVFP4 MoE checkpoints resolve workable runners under auto.'
    applies_to:
    - nvidia/MiniMax-M2.5-NVFP4
    - nvidia/MiniMax-M2.7-NVFP4
    - nvidia/Qwen3.6-35B-A3B-NVFP4
  sm100_sglang_dsv4_device_assert:
    statement: 'b200 re-sweep 2026-08-24, sglang 0.5.16: ALL eight DSV4 artifacts (native fp8 x2, sgl-project FP8
      x2, nvidia NVFP4 x2, base repos x2) crash at first forward with a CUDA device-side assert under runner auto
      — the same checkpoints run on vllm/sm100 and on sglang/sm90 (with the marlin pin). Runner-choice bisect not
      yet done on sm100 (the sm90 fact "auto crashes, marlin runs" does not transfer: marlin is the bf16-dequant
      fallback sm100 should not need). Needs a dedicated bisect; until then DSV4-on-sglang-sm100 is unservable
      out of the box.'
    applies_to:
    - family:dsv4
  sm100_vllm_residuals:
    statement: 'b200 sweep 2026-08-24, vllm 0.24.0 residual fails (6/95): Llama-4 Scout/Maverick vision-tower shape
      mismatch under dummy profiling (tensor 577 vs 1025 — dummy-methodology suspect, not a serving fact; needs
      a vision-config-faithful dummy before blaming the framework); Kimi-K3 (+NVFP4) arch not registered at 0.24.0;
      Gemma-4 NVFP4 tied-embedding quant NotImplementedError (artifact quantizes lm_head that vllm ties to embeddings).
      NVFP4 MoE identity vs SM90: DSV4-NVFP4 and Qwen3-235B-NVFP4 drop the Marlin bf16-dequant kernels on sm100
      (ModelOptNvFp4FusedMoE without marlin under it — native fp4 path); MiniMax-M3-NVFP4 STILL routes ->marlin
      on sm100, and its sparse attention impl moves Triton->MSAImpl. Full grid in results/sm100/vllm-0.24.0.yaml
      + report.html diff view.'
    applies_to:
    - platform:sm100
  dummy_notes:
    statement: layer-kind period is FRAMEWORK-HARDCODED (sglang llama4.py:217 use_rope=(layer_id+1)%4!=0) with no
      config field -> _ARCH_IMPLICIT_PERIODS; aic-core config lacks vision_config -> merged from unsloth mirror
      (vllm builds the vision tower and profiles it even for text-only probes).
    applies_to:
    - meta-llama/Llama-4-Scout-17B-16E-Instruct
  k3_deepep:
    statement: 'NO working deepep mode on sglang 0.5.17 + bundled DeepEP @ SM90 tp8/ep8 (A/B 2026-08-24, both deterministic):
      mode=auto -> AssertionError forward_deepgemm_contiguous is deprecated at the first MoE forward (normal dispatch
      routed into the removed contiguous-deepgemm path; all 8 ranks); mode=low_latency -> DeepEP device assert internode_ll.cu:358
      num_topk <= kNumMaxTopK (K3 num_experts_per_token=16 exceeds the LL kernel cap). Additionally K3''s own SP-collective/MegaMoE
      path is SM103-gated (startup log: requires SM103, TP4/TP8, MegaMoE/DeepEP, CustomAllReduceV2 multicast; falls
      back to NCCL on SM90) — the independent kernel route is unreachable on H20 regardless. Non-deepep tp8/ep8
      (a2a=none) works and matches tp1 kernel families. Evidence facts/tepdep/k3_deepep_{auto_v2,ll}.rank*.json
      + run logs.'
    applies_to:
    - moonshotai/Kimi-K3
  sglang_0516:
    statement: 'CORRECTED 2026-08-23 (retracts the earlier framework_bug verdict): the ''Hidden size mismatch''
      chain was a DUMMY false positive for converted-FP8 checkpoints. sglang picks the DSV4 expert layout by probing
      the safetensors HEADER dtype of one routed-expert tensor (configs/deepseek_v4.py try_detect_fp4_experts);
      weightless dummies probed None -> env default fp4=True -> fp4-packed weights fed to the triton fp8 kernel.
      Real header dtypes (fetched from HF): native deepseek-ai = I8 (fp4-packed), sgl-project FP8 = F8_E4M3, nvidia
      NVFP4 = U8. With the dtype_probe.safetensors signal: converted-FP8 checkpoints RUN OUT OF THE BOX (ok); native/NVFP4
      (true fp4 experts) fail under runner=auto on SM90 and RUN with moe_runner_backend=marlin -> needs_flags (facts/bisect_dsv4_{fp8experts,native_marlin}.json).
      The earlier five-runner-all-fail experiments ran under the wrong fp4 layout and are retracted. The ue8m0/deep_gemm
      SM100-only branch remains a separate real limit for the deep_gemm runner choice.'
    applies_to:
    - family:dsv4
  sglang_0516_flaky:
    statement: trace NONDETERMINISTICALLY fails (~1/3 of runs) in flashinfer cutlass-DSL fused_add_rmsnorm via tvm_ffi
      'Mismatched Tensor' — the same command text both passes and fails on the same GPU (12 controlled reruns 2026-08-21);
      every generator flag excluded by bisection; suspected timing-dependent tensor layout under enable-mixed-chunk.
      Also hits MiniMax-M2.5. Probe retries once and records warmup_retry; persistent failure is a record, not a
      block.
    applies_to:
    - MiniMaxAI/MiniMax-M2
  sglang_marlin_ab:
    statement: 'runner=marlin A/B''d 2026-08-24: SAME capability ValueError — the gate (loader.py:282) checks the
      quant config''s declared min_capability=100 before model construction; runner choice never enters. Declaration-locked,
      no flag escape. Evidence facts/bisect_m3mxfp8_marlin.json.'
    applies_to:
    - MiniMaxAI/MiniMax-M3-MXFP8
  sglang_silent_downgrade:
    statement: 'SGLANG BUG (not ours), mechanism pinned: the artifact ships quant_method=''modelopt'' + quant_algo=''MIXED_PRECISION'';
      sglang 0.5.16''s mixed detector matches only the literal ''modelopt_mixed'' (modelopt_quant.py:622) and the
      generic modelopt fallback greps quant_algo for FP8/NVFP4/FP4 substrings (base_config.py:189-196) — MIXED_PRECISION
      matches neither -> silently Unquantized, zero warnings. Our dummy carries the full real metadata and the SAME
      metadata binds ModelOptNvFp4FusedMoE correctly on vllm. Worth reporting upstream; recheck on 0.5.17.'
    applies_to:
    - nvidia/MiniMax-M3-NVFP4
  sglang_sm90:
    statement: 'NO working path: SM90 gates NVFP4 MoE to marlin only (flashinfer_mxfp4/flashinfer_cutlass/triton
      all rejected ''platform does not support NVFP4 with selected backend''), and marlin fused_moe asserts ''Only
      gated SiLU is supported'' — Gemma uses gelu_pytorch_tanh. framework gap: NVFP4xgelu-MoE unservable on sglang/SM90.
      Dense 31B-IT-NVFP4 passes (no MoE). Evidence facts/bisect_gemma4nvfp4_*.json, 2026-08-24.'
    applies_to:
    - nvidia/Gemma-4-26B-A4B-NVFP4
  sglang_workaround:
    statement: 'flake root-caused to flashinfer cutlass-DSL fused_add_rmsnorm tvm_ffi nondeterminism: SGLANG_IS_FLASHINFER_AVAILABLE=false
      passes 4/4 (facts/bisect_m2_noflashinfer_*.json, 2026-08-22). Deterministic workaround exists; perf cost unmeasured.'
    applies_to:
    - MiniMaxAI/MiniMax-M2
    - MiniMaxAI/MiniMax-M2.5
  sm90_triple:
    statement: 'Same checkpoint, three fates on SM90. vllm 0.24 RUNS but NOT at mxfp8 precision: binds ModelOptMxFp8FusedMoE/LinearMethod
      yet executes marlin_moe_wna16::Marlin + marlin::Marlin — weight-only dequant (W8A16 semantics); perf collected
      here is Marlin-dequant data, not mxfp8 tensor-core data (same class as NVFP4-on-SM90). sglang 0.5.16 DEFINITIVELY
      unservable: explicit quant-method capability floor ''mxfp8 minimum capability 100, current 90'' — not runner-selectable,
      no flag bypasses it. trtllm rc23 DEFINITIVELY unservable but for a NON-quant reason: all three M3 artifacts
      die at the sparse-attention wiring wall before quant matters. Evidence: records + raws, 2026-08-24.'
    applies_to:
    - MiniMaxAI/MiniMax-M3-MXFP8
  support:
    statement: 'Generator/SDK supports K3 since upstream rebase 2026-08-23 (KimiK3Config, KIMIK3 family); the golden
      command renders. Failure now correctly sits at the FRAMEWORK layer: unregistered at the pins (sglang 0.5.16
      / vllm 0.24 / trtllm rc23); registered in latest releases (0.5.17 / 0.27.1 / rc24, probed).'
    applies_to:
    - moonshotai/Kimi-K3
  support_2:
    statement: 'same as moonshotai/Kimi-K3: architecture unregistered at all three pinned framework versions (probe-verified
      2026-08-20).'
    applies_to:
    - nvidia/Kimi-K3-NVFP4
  topology_invariance:
    statement: 'ep/tp sharding on the a2a=none (single-node default) path does NOT change kernel families — measured
      across GLM-5.2-FP8 (tp2/tp8 x ep1/ep2/ep8: triton fused_moe throughout), DSV4-NVFP4 (tp2 x ep1/ep2: marlin),
      Kimi-K2.5-FP8 (tp8 x ep1/ep8: fused_marlin_moe). Evidence facts/tepdep/*.rank0.json, 2026-08-21. Therefore
      tp1 probes represent kernel identity for the default path; multi-rank probing is scoped to routes that change
      kernels.'
    applies_to:
    - a2a=none sharding
  topology_sm103:
    statement: 'the owner-reported TEP8 kernel fork is SM-gated, from sglang''s own dispatch log: ''K3 SP collective
      requires SM103, TP4/TP8, MegaMoE/DeepEP, and CustomAllReduceV2 with multicast; using NCCL.'' — the special
      path never activates on SM90; verify on SM103 (Blackwell Ultra) during the Blackwell replay.'
    applies_to:
    - moonshotai/Kimi-K3
  topology_sm90:
    statement: 'sglang 0.5.17 on SM90 (probed): tp1 and TEP8 and DEP8(a2a=none) all run Mxfp4MoEMethod -> bf16-dequant
      triton fused_moe_kernel, IDENTICAL kernel sets (facts/tepdep/k3_{tep8,dep8}.rank0.json). DEP8+deepep (the
      real DEP deployment route) CRASHES at warmup: ''AssertionError: forward_deepgemm_contiguous is deprecated''
      — the DeepEPMoE route for this quant recipe is broken at 0.5.17/SM90.'
    applies_to:
    - moonshotai/Kimi-K3
  topology_verdict:
    statement: 'Kimi-K2.5 (compressed-tensors W4-packed -> marlin): TEP8 == DEP8 kernel family (sglang::fused_marlin_moe
      + device::marlin_moe::Marlin, same align/reduce/activation set; only shape-tuning template args differ). facts/tepdep/k25_fp8_{tep8,dep8}.rank0.json,
      2026-08-21.'
    applies_to:
    - tp8/ep1
  trtllm_fp8kv:
    statement: 'trtllm rc23/SM90 UNIFIED root cause: fp8 KV cache in the MLA/DSA path crashes natively in flash_mla
      (frame#62 abort). Door 1 = engine kv_cache_config.dtype:fp8 (generator renders for fp8 profiles) -> config_gap,
      kv-auto A/B passes (GLM-5/5.1/5.2-FP8, DSV3.2, MiniMax-M2/M2.5 whose ''Linear assert'' was the same trigger).
      Door 2 = checkpoint hf_quant kv_cache_quant_algo:FP8 (all NVFP4 artifacts) -> framework_bug, kv-auto STILL
      crashes (GLM-5/5.1-NVFP4, DSV3.2-NVFP4). Evidence facts/trt_ab_kvauto_*.json, 2026-08-22.'
    applies_to:
    - MiniMaxAI/MiniMax-M2
    - zai-org/GLM-5-FP8
    - zai-org/GLM-5.1-FP8
    - deepseek-ai/DeepSeek-V3.2
    - MiniMaxAI/MiniMax-M2.5
    - nvidia/GLM-5-NVFP4
    - nvidia/GLM-5.1-NVFP4
    - nvidia/DeepSeek-V3.2-NVFP4
    - family:glm
  trtllm_layers:
    statement: 'rc23 fails in QUANT PARSING before the arch check (quant_config_utils.py:43 NoneType on the 4-bit-float
      compressed-tensors config) — two walls stacked: parser first, arch-unregistered behind it. rc24 passes parsing
      AND registers the arch, then stops at the missing ''fla'' package in the image.'
    applies_to:
    - moonshotai/Kimi-K3
  trtllm_linear_assert:
    statement: 'trtllm rc23: fp8 Linear.apply assertion (linear.py:1142) under the generator-rendered engine args;
      probe-default args loaded fine — surfaced by the fidelity upgrade 2026-08-21.'
    applies_to:
    - MiniMaxAI/MiniMax-M2
    - MiniMaxAI/MiniMax-M2.5
  trtllm_quant_algo:
    statement: hf_quant mixes NVFP4 experts (552 layers) with FP8_PB_WO attention projections (2790 layers, fp8
      per-block WEIGHT-ONLY). FP8_PB_WO is absent from the QuantAlgo enum in rc23 AND rc24; nearest member FP8_BLOCK_SCALES
      is W8A8 (fp8 activations), NOT weight-only — no semantic equivalent exists, so this needs a new enum + fp8
      weight-only dequant path in trtllm, not a rename. W4A16 kernels exist but only apply to the expert half. Enum
      grep-verified 2026-08-24.
    applies_to:
    - nvidia/Kimi-K3-NVFP4
  trtllm_quant_parser:
    statement: rc23 quant_config_utils.py:43 crashes (NoneType) parsing the native compressed-tensors W4 quantization_config
      — framework_bug; K2.5-NVFP4 sibling fails separately on NVFP4 MoE tactics (platform_floor SM100).
    applies_to:
    - moonshotai/Kimi-K2.5
  trtllm_rc23:
    statement: 'trtllm rc23: NOT capacity (2026-08-21 explanation RETRACTED — the 64B/120GiB arithmetic used gated-3-mat
      at hidden width, ignoring moe_latent_size=2048+relu2; true experts/layer ~10.7B). Measured 2026-08-23: peak
      33GB/96GB, weights fit; crash is a native ILLEGAL MEMORY ACCESS right after model init (cudaStreamDestroy
      IMA -> abort in KVCacheManager teardown, exit 139, no raw written). Isolation: Ultra-BF16/FP8 pass trtllm,
      Nano/Super-NVFP4 pass trtllm — Ultra-shape x NVFP4-path specific framework bug. Evidence facts/ultra_nvfp4_trt_ima.log
      + mem monitor.'
    applies_to:
    - nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
  trtllm_rc23_2:
    statement: 'DSV4 rejected at load: ''Missing COMPRESS pool metadata for compress ratio 4'' — CSA compression
      unsupported on this path.'
    applies_to:
    - family:dsv4
  trtllm_rc24:
    statement: rc24 registers KimiK3ForConditionalGeneration but the nvcr image lacks the 'fla' (flash-linear-attention)
      package its model file imports — K3 is unserveable on the shipped image (probe-verified 2026-08-21).
    applies_to:
    - moonshotai/Kimi-K3
  trtllm_sparse_config:
    statement: 'MiniMax-M3 on trtllm REQUIRES llmapi sparse_attention_config (algorithm: minimax_m3) to get MiniMaxM3KVCacheManagerV2
      — the generator does not render it (needs_flags). With it set, rc23/SM90 still fails deeper (MiniMaxM3SparseRuntimeBackend.forward
      missing cache args — framework gap, recheck on rc24/Blackwell). Evidence facts/trt_ab_m3_sparse.json.'
    applies_to:
    - family:m3
  trtllm_tokens_per_block:
    statement: DeepseekV4CacheManager requires tokens_per_block in [128,256]; the generator renders 64 (FPM example
      value) — ILLEGAL FOR THIS ARCH ON ANY PLATFORM (needs_flags for the generator). With 128 the load proceeds
      to the explicit pre-blackwell rejection -> final cause on SM90 is platform_floor. Evidence facts/trt_ab_dsv4_tpb128.json,
      2026-08-22.
    applies_to:
    - family:dsv4
  vllm_024:
